<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro - RBCML</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/home.css') }}">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 2rem;
            text-align: center;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .error-message {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 2rem;
        }
        .error-button {
            padding: 12px 30px;
            background-color: #471C01;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        .error-button:hover {
            background-color: #000000;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <span class="header-container">
            <div class="nav-bar-logo">
                <a href="{{ url_for('main.view_home') }}">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo">
                </a>
            </div>
            <div class="nav-bar-models">
                <ul>
                    <li><a href="{{ url_for('main.view_home') }}">Home</a></li>
                </ul>
            </div>
        </span>
    </header>

    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <div class="error-message">
            {{ message if message else 'Ocorreu um erro inesperado.' }}
        </div>
        <a href="{{ url_for('main.view_home') }}" class="error-button">
            Voltar para Home
        </a>
    </div>
</body>
</html>
